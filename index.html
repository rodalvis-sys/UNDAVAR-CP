<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNDAVAR — Cuaderno de Campaña</title>
<meta name="description" content="Fichas, tienda y oráculo del Sabio Regidor para el juego de rol UNDAVAR. Funciona sin conexión.">
<meta name="theme-color" content="#120f14">
<link rel="manifest" href="manifest.json">
<!-- [UNDAVAR-PARTE-8-ICONO] Icono preparado para la app y la PWA -->
<link rel="icon" href="icons/icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=122">
<script>
  // [UNDAVAR-PARTE-3.4C] Restaura el rail antes del primer pintado para evitar parpadeo.
  try {
    if (localStorage.getItem("undavar_rail_expandido") === "1") {
      document.documentElement.classList.add("rail-expandido");
    }
  } catch (e) { }
</script>
</head>
<body>

<!-- [UNDAVAR-PARTE-3.5] Salto de contenido para teclado -->
<a class="salto-contenido" href="#app">Saltar al contenido</a>

<!-- [UNDAVAR-PARTE-3.4B] Shell editorial con rail expandible -->
<div class="app-shell">
  <aside class="sidebar" id="rail">
    <div class="sidebar-marca">
      <!-- [UNDAVAR-PARTE-8B-ICONOS] El emblema circular sustituye a la estrella -->
      <div class="rail-logo" aria-hidden="true"><img src="icons/icon-192.png" alt=""></div>
      <button type="button" class="rail-toggle" id="btn-rail-toggle" aria-label="Expandir menú" aria-expanded="false" title="Expandir menú">
        <span data-icono="chevron"></span>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Secciones principales">
      <a href="#" class="navlink activo" data-vista="inicio" data-etiqueta="Inicio" title="Inicio">
        <span class="nav-ico" data-icono="inicio"></span><span class="rail-label">Inicio</span>
      </a>
      <!-- [UNDAVAR-PARTE-9.1-METAS] Entrada del rail para los objetivos de campaña -->
      <a href="#" class="navlink" data-vista="metas" data-etiqueta="Metas" title="Metas">
        <span class="nav-ico" data-icono="metas"></span><span class="rail-label">Metas</span>
      </a>
      <a href="#" class="navlink" data-vista="ficha" data-etiqueta="Ficha PJ" title="Ficha PJ">
        <span class="nav-ico" data-icono="ficha"></span><span class="rail-label">Ficha PJ</span>
      </a>
      <a href="#" class="navlink" data-vista="npc" data-etiqueta="PNJ / Bestias" title="PNJ / Bestias">
        <span class="nav-ico" data-icono="npc"></span><span class="rail-label">PNJ / Bestias</span>
      </a>
      <a href="#" class="navlink" data-vista="tienda" data-etiqueta="Tienda" title="Tienda">
        <span class="nav-ico" data-icono="tienda"></span><span class="rail-label">Tienda</span>
      </a>
      <a href="#" class="navlink" data-vista="oraculo" data-etiqueta="Oráculo" title="Oráculo">
        <span class="nav-ico" data-icono="oraculo"></span><span class="rail-label">Oráculo</span>
      </a>
      <a href="#" class="navlink" data-vista="dividida" data-etiqueta="Vista dividida" title="Vista dividida">
        <span class="nav-ico" data-icono="dividida"></span><span class="rail-label">Vista dividida</span>
      </a>
      <a href="#" class="navlink" data-vista="enfrentamiento" data-etiqueta="Tiradas enfrentadas" title="Tiradas enfrentadas">
        <span class="nav-ico" data-icono="enfrentamiento"></span><span class="rail-label">Tiradas enfrentadas</span>
      </a>
      <a href="#" class="navlink" data-vista="combate" data-etiqueta="Combate" title="Combate">
        <span class="nav-ico" data-icono="espadas"></span><span class="rail-label">Combate</span>
      </a>
      <a href="#" class="navlink" data-vista="dados" data-etiqueta="Dados" title="Dados">
        <span class="nav-ico" data-icono="dados"></span><span class="rail-label">Dados</span>
      </a>
      <!-- [UNDAVAR-PARTE-8B-ICONOS] Entrada del mapa con icono SVG de mapa -->
      <a href="#" class="navlink" data-vista="mapa" data-etiqueta="Mapa" title="Mapa">
        <span class="nav-ico" data-icono="mapa"></span><span class="rail-label">Mapa</span>
      </a>
      <!-- [UNDAVAR-PARTE-10.11-GALERIA] Galería de imágenes, debajo del mapa -->
      <a href="#" class="navlink" data-vista="galeria" data-etiqueta="Galería" title="Galería">
        <span class="nav-ico" data-icono="galeria"></span><span class="rail-label">Galería</span>
      </a>
    </nav>

    <div class="sidebar-pie">
      <span id="estado-conexion" class="rail-pie-dot" title="Estado de conexión">●</span>
      <!-- [UNDAVAR-PARTE-8-PERFIL] Avatar de usuario editable -->
      <button type="button" class="rail-perfil" id="rail-perfil" aria-label="Perfil de usuario" title="Perfil de usuario">
        <span class="rail-avatar" id="rail-avatar" aria-hidden="true">U</span>
      </button>
    </div>
  </aside>

  <div class="app-main">
    <main id="app" class="contenido" tabindex="-1"></main>
  </div>
</div>

<script src="js/icons.js?v=122"></script>
<script src="js/rules.js?v=122"></script>
<script src="js/db.js?v=122"></script>
<script src="js/oraculo.js?v=122"></script>
<script src="js/app.js?v=122"></script>
<script>
  function actualizarEstadoConexion() {
    const el = document.getElementById("estado-conexion");
    if (!el) return;
    el.classList.toggle("en-linea", navigator.onLine);
    el.title = navigator.onLine ? "En línea" : "Sin conexión (modo local)";
  }
  window.addEventListener("online", actualizarEstadoConexion);
  window.addEventListener("offline", actualizarEstadoConexion);
  actualizarEstadoConexion();
</script>
</body>
</html>
